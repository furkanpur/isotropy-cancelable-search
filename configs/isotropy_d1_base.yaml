name: d1_base
data:
  kind: sin
  root: /data/primary
  model: base
  relabel: /data/relabel/d1_relabel.csv
  shifted_aux:
    kind: sin
    root: /data/secondary
    model: base
    relabel: /data/relabel/secondary_relabel.csv
    relabel_key: path
    exclude_primary_identities: true
    near_dup_cos: 0.95
split: {n_dev: 1000, n_tgt: 1200, min_tgt_images: 3, seeds: [101, 102, 103, 104, 105]}
keys_per_seed: 3
fmr: [0.001, 0.01]
preconditioners: [none, "pca:128:1", "pca:256:1", "pca:128:0.5", "fi:64:512", "fi:128:512", "fi:256:512", "rbig:128:2", "firbig:128:512:2"]
schemes: ["lrp:full", "lrp:half", "biohash:half", "iom:256"]
attacks:
  anchor:
    r_grid: [5, 10, 20, 40, 80, 160, 320, 640]
    variants: [exact, fresh]
    decoders: [ridge, proj, mlp]
    min_targets: 100
    mlp_subset: {pres: [none, "fi:128:512"], schemes: ["lrp:full", "iom:256"], r: [80, 320, 640]}
  zeropair: {p_grid: [8, 16, 32, 64, 128], methods: [eigen, ica, wp], ica_max_dim: 128, expensive_keys: 1}
  postcompromise: {enabled: true, keys: 1}
bootstrap: {n_boot: 1000}
